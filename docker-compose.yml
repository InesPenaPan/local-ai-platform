version: '3.8'

services:

  # Qdrant Vector Database (Port 6333)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always
    networks:
      - ai_network

  # LLM Service (Port 8001)
  llm-service:
    build: ./llm-service
    container_name: llm_service
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - ai_network

  # RAG Service (Port 8002) - Gestiona documentos, embeddings y Qdrant
  rag-service:
    build: ./rag-service
    container_name: rag_service
    ports:
      - "8002:8002"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLM_SERVICE_URL=http://llm-service:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - llm-service
    restart: always
    networks:
      - ai_network

  # API Gateway (Port 8000)
  api-gateway:
    build: ./api-gateway
    container_name: api_gateway
    ports:
      - "8000:8000"
    environment:
      - LLM_SERVICE_URL=http://llm-service:8001
      - RAG_SERVICE_URL=http://rag-service:8002
      - AGENT_SERVICE_URL=http://agent_service:8003
    depends_on:
      - llm-service
      - rag-service
      - agent_service
    restart: always
    networks:
      - ai_network

  # Front-end (Port 5173)
  ai-app:
    build: ./ai-app
    container_name: ai_app
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    restart: always
    networks:
      - ai_network

  # Agent Service (Port 8003)
  agent_service:
    build: ./agent-service
    container_name: agent_service
    ports:
      - "8003:8003"
    volumes:
      - ./agent-service:/app
    restart: unless-stopped
    networks:
      - ai_network

volumes:
  qdrant_storage:

networks:
  ai_network:
    driver: bridge